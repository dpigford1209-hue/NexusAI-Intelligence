{% extends "base.html" %}
{% block title %}Reset Password — NexusAI{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:400px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:40px;margin-bottom:8px">🔒</div>
      <h1 style="color:#818cf8;font-size:22px">Set New Password</h1>
      <p class="muted" style="margin-top:4px">Choose a strong password</p>
    </div>
    <div class="card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash-box flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-input" type="password" name="password" placeholder="Min. 8 characters" required autofocus/>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-input" type="password" name="confirm" placeholder="Repeat password" required/>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
